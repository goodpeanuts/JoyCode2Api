name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.7.0)'
        required: true

permissions:
  contents: write

# 产物命名是发布链路的单一契约：
#   release.yml（此处 BINARY_NAME）
#   = install.sh（ASSET_PREFIX）
#   = cmd/JoyCodeProxy/update.go（assetName()）
#   = README 安装说明
# 三处必须保持 "joycode-proxy-<os>-<arch>" 小写格式，修改任一处时同步其余。
env:
  BINARY_NAME: joycode-proxy

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify frontend output
        run: test -f cmd/JoyCodeProxy/static/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: cmd/JoyCodeProxy/static/
          retention-days: 1

  build-binaries:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: cmd/JoyCodeProxy/static/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.suffix }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${{ steps.version.outputs.num }}" \
            -o "dist/${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.ext }}" \
            ./cmd/JoyCodeProxy/

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: dist/
          retention-days: 1

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      # 一致性断言：checksums 必须覆盖全部 5 个平台产物，
      # 防止产物命名与 install.sh / update.go 的期望再次漂移。
      - name: Assert expected assets
        run: |
          cd dist
          for asset in \
            ${{ env.BINARY_NAME }}-darwin-arm64 \
            ${{ env.BINARY_NAME }}-darwin-amd64 \
            ${{ env.BINARY_NAME }}-linux-amd64 \
            ${{ env.BINARY_NAME }}-linux-arm64 \
            ${{ env.BINARY_NAME }}-windows-amd64.exe; do
            test -f "$asset" || { echo "缺失产物: $asset"; exit 1; }
          done
          echo "全部 5 个平台产物就绪"

      # install.sh 随 release 一并发布，README 的一键安装命令指向
      # releases/latest/download/install.sh，保证安装脚本与产物版本一致、不随分支漂移。
      - name: Stage installer
        run: cp install.sh dist/install.sh

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ${{ env.BINARY_NAME }}-* install.sh > checksums-sha256.txt

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "jcproxy ${{ steps.version.outputs.tag }}"
          body: |
            ## jcproxy ${{ steps.version.outputs.tag }}

            ### 一键安装（macOS / Linux）
            ```bash
            curl -fsSL https://github.com/goodpeanuts/JoyCode2Api/releases/latest/download/install.sh | bash
            ```
            用户级安装（免 sudo）：
            ```bash
            curl -fsSL https://github.com/goodpeanuts/JoyCode2Api/releases/latest/download/install.sh | INSTALL_MODE=user bash
            ```

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `${{ env.BINARY_NAME }}-darwin-arm64` |
            | macOS (Intel) | `${{ env.BINARY_NAME }}-darwin-amd64` |
            | Linux (x86_64) | `${{ env.BINARY_NAME }}-linux-amd64` |
            | Linux (arm64) | `${{ env.BINARY_NAME }}-linux-arm64` |
            | Windows (x86_64) | `${{ env.BINARY_NAME }}-windows-amd64.exe` |

            ### Quick Start
            ```bash
            # macOS / Linux
            chmod +x ${{ env.BINARY_NAME }}-<platform>
            ./${{ env.BINARY_NAME }}-<platform> serve

            # Windows
            ${{ env.BINARY_NAME }}-windows-amd64.exe serve
            ```

            ### Verify checksum
            ```bash
            sha256sum -c checksums-sha256.txt
            ```

            ### 升级
            ```bash
            jcproxy update
            ```
          files: dist/*
